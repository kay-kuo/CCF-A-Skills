name: ccf-figure-table
version: 0.1.0
status: stable-initial
purpose: "设计 CCF-A 论文的方法图、实验表、消融表、case study、error analysis 和 caption。"
trigger: "Use when the user asks for figures, tables, diagrams, experiment result organization, captions, or visual evidence planning."
shared_dependencies:
  - ../_shared/ccf_principles.md
  - ../_shared/evidence_policy.md
  - ../_shared/venue_profiles.yaml
  - ../_shared/output_schemas.md
axes:
  artifact_type:
    - method_overview
    - algorithm_diagram
    - main_result_table
    - ablation_table
    - robustness_plot
    - efficiency_plot
    - case_study
    - error_analysis
  venue_family:
    - ml_general
    - cv
    - nlp
    - data_mining_ir_web
    - systems_security_se_pl
    - medical_ai_imaging
  medium:
    - paper
    - appendix
    - poster
    - slides
  output:
    - layout_spec
    - latex_table
    - caption
    - plot_code_plan
required_outputs:
  - Figure/table plan
  - Panel layout
  - Caption draft
  - Evidence mapping
  - QA checklist
workflow: "choose claim → choose visual evidence → design layout → write caption → QA risk check"
anti_hallucination:
  - Do not fabricate citations.
  - Do not fabricate experimental results.
  - Do not fabricate dataset sizes or statistics.
  - Use TODO(author-confirm) for missing information.
quality_gate: tests/rubric.md
