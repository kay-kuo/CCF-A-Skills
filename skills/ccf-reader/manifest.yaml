name: ccf-reader
version: 0.1.0
status: stable-initial
purpose: "精读 CCF-A 论文，抽取 background-problem-challenge-method-novelty-experiment，并形成 reviewer-aware paper card。"
trigger: "Use when the user asks to read, dissect, translate, or analyze a CS/AI conference or journal paper."
shared_dependencies:
  - ../_shared/ccf_principles.md
  - ../_shared/evidence_policy.md
  - ../_shared/venue_profiles.yaml
  - ../_shared/output_schemas.md
axes:
  input_type:
    - pdf
    - latex
    - markdown
    - abstract
    - url_or_doi
    - notes
  read_depth:
    - quick_scan
    - full_read
    - replication_read
    - reviewer_read
  venue_family:
    - ml_general
    - cv
    - nlp
    - data_mining_ir_web
    - systems_security_se_pl
    - medical_ai_imaging
    - journal_extension
  output_language:
    - zh-CN
    - en
    - bilingual
required_outputs:
  - Paper Card
  - Method Card
  - Experiment Card
  - Novelty/Risk Card
  - Citation Use Card
workflow: "extract → align → compare → risk-scan → report"
anti_hallucination:
  - Do not fabricate citations.
  - Do not fabricate experimental results.
  - Do not fabricate dataset sizes or statistics.
  - Use TODO(author-confirm) for missing information.
quality_gate: tests/rubric.md
