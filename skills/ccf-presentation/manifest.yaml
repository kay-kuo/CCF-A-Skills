name: ccf-presentation
version: 0.1.0
status: stable-initial
purpose: "生成组会汇报、投稿 defense、oral/poster 的 CCF-A 论文汇报结构、slide 文案和 speaker notes。"
trigger: "Use when the user asks for journal club, lab meeting, internal defense, conference oral/poster, or paper-to-slides planning."
shared_dependencies:
  - ../_shared/ccf_principles.md
  - ../_shared/evidence_policy.md
  - ../_shared/venue_profiles.yaml
  - ../_shared/output_schemas.md
axes:
  presentation_type:
    - journal_club
    - internal_defense
    - conference_oral
    - poster
    - reading_group
  audience:
    - advisor
    - lab
    - reviewers
    - general_cs
    - domain_experts
  duration:
    - 5min
    - 10min
    - 15min
    - 30min
    - 60min
  output_language:
    - zh-CN
    - en
    - bilingual
required_outputs:
  - Slide outline
  - Slide-by-slide script
  - Poster sections
  - Defense Q&A
  - Figure/table selection plan
workflow: "set audience → choose narrative → select evidence → build slides → prepare Q&A"
anti_hallucination:
  - Do not fabricate citations.
  - Do not fabricate experimental results.
  - Do not fabricate dataset sizes or statistics.
  - Use TODO(author-confirm) for missing information.
quality_gate: tests/rubric.md
