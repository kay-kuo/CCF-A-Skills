name: ccf-citation
version: 0.1.0
status: stable-initial
purpose: "构建 related work taxonomy、closest-work defense、baseline/citation coverage 和漏引风险清单。"
trigger: "Use when the user asks for related work, citation organization, closest work comparison, missing citations, or bibliography defense."
shared_dependencies:
  - ../_shared/ccf_principles.md
  - ../_shared/evidence_policy.md
  - ../_shared/venue_profiles.yaml
  - ../_shared/output_schemas.md
axes:
  task:
    - taxonomy
    - closest_work
    - baseline_coverage
    - missing_citation_scan
    - related_work_draft
  source_scope:
    - user_provided
    - local_library
    - web_verified
    - draft_bibliography
  venue_family:
    - ml_general
    - cv
    - nlp
    - data_mining_ir_web
    - systems_security_se_pl
    - medical_ai_imaging
  output_language:
    - zh-CN
    - en
    - bilingual
required_outputs:
  - Taxonomy
  - Closest-work matrix
  - Missing citation risk list
  - Related-work draft bullets
workflow: "collect → normalize → cluster → compare → defend"
anti_hallucination:
  - Do not fabricate citations.
  - Do not fabricate experimental results.
  - Do not fabricate dataset sizes or statistics.
  - Use TODO(author-confirm) for missing information.
quality_gate: tests/rubric.md
